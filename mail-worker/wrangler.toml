name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			# D1 binding name; do not change
database_name = "cloud-mail"		# D1 database name
database_id = "01f4a31e-846f-4206-9077-33bc13f4c239"		# D1 database id

[[kv_namespaces]]
binding = "kv"			# KV binding name; do not change
id = "bd7e6959fd9e4d1b9b453e4724c2fa80"					# KV namespace id

#[[r2_buckets]]
#binding = "r2"			# R2 binding name; do not change
#bucket_name = ""		# R2 bucket name

#[[send_email]]
#name = "email"			# Cloudflare Email Sending; used first if configured

[[send_email]]
name = "forward"		# Forward in-app mail to other verified addresses; not limited to one address

[ai]
binding = "ai"

[assets]
binding = "assets"		# Assets binding name; do not change
directory = "./dist"	# Built Vue assets directory, default dist
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/oss/*", "/static/*", "/attachments/*", "/proxy", "/realtime" ]

[triggers]
crons = ["0 * * * *"]	# Hourly cron; resetDaySendCount only runs at UTC 0

[[durable_objects.bindings]]
name = "ws"
class_name = "MailHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MailHub"]


[vars]
#ai_model = ""			# AI model; defaults to @cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			# Enable analytics cache
#orm_log = false			# SQL logging
domain = ["jiusuzulin.com"]				# Mail domains; multiple allowed, e.g. ["example1.com","example2.com"]
admin = "admin@jiusuzulin.com"			# Admin email, e.g. admin@example.com
#password = ""				# Admin password; used on init if the admin user does not exist
jwt_secret = "cm2026-jiusuzulin-secret-8f3k9z"	# JWT secret; any random string

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
